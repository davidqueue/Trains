<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Catch the Train · St James Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf7;
    --ink:#16140f;
    --ink-2:#5a564b;
    --line:#e6e2d6;
    --line-2:#c9c4b3;
    --accent:#1f5a45;
    --green:#1f5a45;
    --amber:#a87209;
    --red:#a8341a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Fraunces", Georgia, serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100dvh}
  .wrap{max-width:600px;margin:0 auto;padding:32px 22px 64px;}

header{margin-bottom:28px}
.kicker{font-family:“JetBrains Mono”,monospace;font-size:10px;letter-spacing:.28em;
text-transform:uppercase;color:var(–ink-2);}
h1{font-weight:600;font-size:clamp(34px,8vw,52px);line-height:1.0;
margin:8px 0 0;letter-spacing:-.02em;}
h1 em{font-style:italic;font-weight:400}
.station-tag{font-family:“JetBrains Mono”,monospace;font-size:11px;
letter-spacing:.16em;text-transform:uppercase;color:var(–ink-2);
margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.station-tag .dot{width:6px;height:6px;border-radius:50%;background:var(–ink-2);display:inline-block}

/* Status banner */
.status-banner{margin-bottom:24px;padding:12px 14px;border-left:3px solid var(–line-2);
font-family:“JetBrains Mono”,monospace;font-size:12px;color:var(–ink-2);
line-height:1.5;display:none}
.status-banner.show{display:block}
.status-banner.disruption{border-left-color:var(–amber);color:var(–ink);
background:#fbf6ea}
.status-banner.severe{border-left-color:var(–red);color:var(–ink);
background:#fbeee9}
.status-banner strong{font-weight:500;letter-spacing:.05em;text-transform:uppercase;
font-size:10px;display:block;margin-bottom:4px}

/* Verdict block */
.verdict{padding:28px 0 36px;border-bottom:1px solid var(–line);}
.verdict .label{font-family:“JetBrains Mono”,monospace;font-size:10px;
letter-spacing:.22em;text-transform:uppercase;color:var(–ink-2);}
.verdict .pace{font-weight:600;font-style:italic;font-size:clamp(72px,20vw,120px);
line-height:.92;letter-spacing:-.035em;margin:8px 0 4px;}
.verdict.go .pace{color:var(–green)}
.verdict.hurry .pace{color:var(–amber)}
.verdict.run .pace{color:var(–red)}
.verdict.miss .pace{color:var(–ink-2)}
.verdict .sub{font-family:“Fraunces”,serif;font-size:18px;color:var(–ink);
font-style:italic;margin-top:2px}
.pace-desc{font-family:“JetBrains Mono”,monospace;font-size:11px;
color:var(–ink-2);margin-top:10px;letter-spacing:.04em;line-height:1.5}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);
padding:18px 0;border-bottom:1px solid var(–line);}
.stat .k{font-family:“JetBrains Mono”,monospace;font-size:10px;letter-spacing:.2em;
text-transform:uppercase;color:var(–ink-2);margin-bottom:4px}
.stat .v{font-weight:600;font-size:22px;letter-spacing:-.01em}

/* Map button */
.map-link{display:inline-flex;align-items:center;gap:10px;margin:22px 0 6px;
padding:12px 16px;border:1px solid var(–ink);background:var(–bg);
color:var(–ink);text-decoration:none;font-family:“JetBrains Mono”,monospace;
font-size:11px;letter-spacing:.18em;text-transform:uppercase;
transition:background .15s ease}
.map-link:hover{background:var(–ink);color:var(–bg)}
.map-link svg{width:14px;height:14px}

/* Trains list */
.trains{padding:24px 0 0}
.trains-title{font-family:“JetBrains Mono”,monospace;font-size:10px;
letter-spacing:.22em;text-transform:uppercase;color:var(–ink-2);margin-bottom:14px}
.train-row{display:flex;align-items:baseline;justify-content:space-between;
padding:14px 0;border-bottom:1px solid var(–line);}
.train-row:last-child{border-bottom:0}
.train-row .when{font-weight:600;font-size:22px;font-style:italic;letter-spacing:-.01em}
.train-row .meta{font-family:“JetBrains Mono”,monospace;font-size:11px;
color:var(–ink-2);text-align:right;line-height:1.4}
.train-row.picked{position:relative}
.train-row.picked::before{content:””;position:absolute;left:-14px;top:50%;
width:6px;height:6px;border-radius:50%;background:var(–accent);
transform:translateY(-50%)}
.train-row.picked .when{color:var(–accent)}

/* Footer status */
.foot-status{margin-top:28px;font-family:“JetBrains Mono”,monospace;font-size:11px;
color:var(–ink-2);line-height:1.5}
.err{color:var(–red)}

footer{margin-top:36px;padding-top:18px;border-top:1px solid var(–line);
font-family:“JetBrains Mono”,monospace;font-size:10px;letter-spacing:.18em;
text-transform:uppercase;color:var(–ink-2);text-align:center;}

.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(–accent);
margin-right:6px;animation:pulse 1.4s infinite ease-in-out;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>David <em>is going to</em> St James Street Overground</h1>
    <div class="station-tag">
      <span>Walthamstow</span>
      <span class="dot"></span>
      <span>Inbound</span>
    </div>
  </header>

  <div id="statusBanner" class="status-banner"></div>

  <div id="verdict" class="verdict">
    <div class="label">You need to walk at</div>
    <div class="pace" id="paceVal">—</div>
    <div class="sub" id="paceSub"><span class="pulse"></span>Loading…</div>
    <div class="pace-desc" id="paceDesc"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">Walking</div><div class="v" id="distVal">—</div></div>
    <div class="stat"><div class="k">Cool-down</div><div class="v" id="coolVal">—</div></div>
    <div class="stat"><div class="k">Next train</div><div class="v" id="trainVal">—</div></div>
  </div>

  <a id="mapLink" class="map-link" href="#" target="_blank" rel="noopener" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0 0 21 18.382V7.618a1 1 0 0 0-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
    Open route in Google Maps
  </a>

  <div class="trains">
    <div class="trains-title">Upcoming inbound</div>
    <div id="trainsList"><div class="foot-status">Waiting for data…</div></div>
  </div>

  <div id="locStatus" class="foot-status"><span class="pulse"></span>Asking for your location…</div>

  <footer>Data © Transport for London · Walking route © OpenStreetMap</footer>
</div>

<script>
  const STATION = {
    id: "910GSTJMSST",
    name: "St James Street",
    lat: 51.5828,
    lon: -0.0098,
    direction: "inbound"
  };
  const LINE_ID = "weaver"; // Overground line serving St James Street
  const TFL = "https://api.tfl.gov.uk";
  const REFRESH_ARRIVALS_MS = 30000;
  const REFRESH_STATUS_MS = 5 * 60 * 1000;
  const REFRESH_ROUTE_MS = 2 * 60 * 1000;
  const REFRESH_WEATHER_MS = 15 * 60 * 1000;

  function cooldownSeconds(tempC){
    if (tempC == null) return 120; // sensible default ≈ 2 min
    if (tempC < 8)  return 60;
    if (tempC < 17) return 120;
    if (tempC < 22) return 180;
    return 240;
  }

  const $ = (id) => document.getElementById(id);

  // ---------- Distance helpers ----------
  function haversine(a, b){
    const R = 6371000, toRad = (d) => d*Math.PI/180;
    const dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
    const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  const mToKm = (m) => m / 1000;
  function fmtKm(m){
    if (m < 100) return `${Math.round(m)} m`;
    const km = mToKm(m);
    return `${km.toFixed(2)} km`;
  }
  function fmtMinSec(sec){
    if (sec < 0) return "—";
    const m = Math.floor(sec/60), s = Math.round(sec%60);
    return `${m}:${s.toString().padStart(2,"0")}`;
  }

  // ---------- TfL ----------
  async function getStationCoords(){
    try {
      const r = await fetch(`${TFL}/StopPoint/${STATION.id}`);
      if (!r.ok) return;
      const d = await r.json();
      if (d.lat && d.lon){ STATION.lat = d.lat; STATION.lon = d.lon; }
    } catch {}
  }
  async function getArrivals(){
    const r = await fetch(`${TFL}/StopPoint/${STATION.id}/Arrivals`);
    if (!r.ok) throw new Error("TfL arrivals fetch failed");
    const all = await r.json();
    return all
      .filter(a => a.direction === STATION.direction)
      .map(a => ({
        line: a.lineName,
        platform: a.platformName,
        destination: a.destinationName || a.towards,
        eta: new Date(a.expectedArrival).getTime()
      }))
      .filter(a => !Number.isNaN(a.eta))
      .sort((x,y) => x.eta - y.eta);
  }
  async function getTemperature(){
    // Open-Meteo: free, no key. Current temperature at the station's coords.
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${STATION.lat}&longitude=${STATION.lon}&current=temperature_2m`;
      const r = await fetch(url);
      if (!r.ok) return null;
      const d = await r.json();
      return d?.current?.temperature_2m ?? null;
    } catch { return null; }
  }

  async function getLineStatus(){
    // Try Weaver first; if not yet recognised, fall back to broader Overground status
    try {
      const r = await fetch(`${TFL}/Line/${LINE_ID}/Status`);
      if (r.ok){
        const d = await r.json();
        if (Array.isArray(d) && d.length) return d[0];
      }
    } catch {}
    try {
      const r2 = await fetch(`${TFL}/Line/london-overground/Status`);
      if (r2.ok){
        const d = await r2.json();
        if (Array.isArray(d) && d.length) return d[0];
      }
    } catch {}
    return null;
  }

  // ---------- OSRM walking route ----------
  let walkRouteM = null; // walking distance in metres (null = use straight line)
  let lastRouteFetchKey = null;

  async function fetchWalkingRoute(from){
    // OSRM public demo: free, no key. Note: subject to rate limits & demo availability.
    const url = `https://router.project-osrm.org/route/v1/foot/${from.lon},${from.lat};${STATION.lon},${STATION.lat}?overview=false`;
    try {
      const r = await fetch(url);
      if (!r.ok) return null;
      const d = await r.json();
      if (d.code === "Ok" && d.routes && d.routes[0]){
        return d.routes[0].distance; // metres
      }
    } catch {}
    return null;
  }

  function googleMapsUrl(from){
    // Walking directions on Google Maps
    return `https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lon}&destination=${STATION.lat},${STATION.lon}&travelmode=walking`;
  }

  // ---------- Pace tiers (m/s) ----------
  const STROLL = 1.25, NORMAL = 1.40, BRISK = 1.65, FAST = 1.95, RUN = 2.50;
  function paceVerdict(distM, secondsLeft){
    if (secondsLeft <= 0) return { tier:"miss", label:"You've missed it", desc:"", speed:null };
    const reqSpeed = distM / secondsLeft; // m/s
    const kmh = reqSpeed * 3.6;
    let tier, label, desc;
    if (reqSpeed <= STROLL)      { tier="go";    label="Strolling pace";   desc="Casual stroll — pensioner with a newspaper"; }
    else if (reqSpeed <= NORMAL) { tier="go";    label="Normal walk";      desc="Average adult walking pace"; }
    else if (reqSpeed <= BRISK)  { tier="go";    label="Brisk walk";       desc="Fit 30-year-old, slightly purposeful"; }
    else if (reqSpeed <= FAST)   { tier="hurry"; label="Power walk";       desc="You're late and you know it"; }
    else if (reqSpeed <= RUN)    { tier="run";   label="Light jog";        desc="Olympic race-walker territory"; }
    else                          { tier="miss";  label="Not happening on foot"; desc="Even running won't catch this one"; }
    return { tier, label, desc, speed: kmh };
  }

  // ---------- State ----------
  let userPos = null;
  let arrivalsCache = [];
  let statusCache = null;
  let tempC = null;
  let lastRouteRefresh = 0;

  // ---------- Geolocation ----------
  function startWatch(){
    if (!navigator.geolocation){
      $("locStatus").innerHTML = `<span class="err">Geolocation not supported by this browser.</span>`;
      return;
    }
    navigator.geolocation.watchPosition(
      (p) => {
        userPos = { lat:p.coords.latitude, lon:p.coords.longitude, accuracy:p.coords.accuracy };
        // Update Google Maps link immediately
        const link = $("mapLink");
        link.href = googleMapsUrl(userPos);
        link.style.display = "inline-flex";

        // Refresh walking route if we've moved more than ~50m or it's been a while
        const key = `${userPos.lat.toFixed(4)},${userPos.lon.toFixed(4)}`;
        const now = Date.now();
        if (key !== lastRouteFetchKey || now - lastRouteRefresh > REFRESH_ROUTE_MS){
          lastRouteFetchKey = key;
          lastRouteRefresh = now;
          fetchWalkingRoute(userPos).then(dist => {
            if (dist != null){ walkRouteM = dist; render(); }
          });
        }

        const dist = haversine(userPos, STATION);
        $("locStatus").innerHTML = `Located ±${Math.round(userPos.accuracy)} m · ${fmtKm(dist)} straight-line from ${STATION.name}`;
        render();
      },
      (e) => {
        $("locStatus").innerHTML = `<span class="err">Location error: ${e.message}. Allow location access in your browser.</span>`;
      },
      { enableHighAccuracy:true, maximumAge:10000, timeout:15000 }
    );
  }

  // ---------- Render ----------
  function renderStatus(){
    const b = $("statusBanner");
    if (!statusCache){ b.classList.remove("show"); return; }
    const ls = statusCache.lineStatuses || [];
    if (!ls.length){ b.classList.remove("show"); return; }
    const worst = ls.reduce((a,c) => (c.statusSeverity ?? 10) < (a.statusSeverity ?? 10) ? c : a);
    const sev = worst.statusSeverity;
    if (sev >= 10){ b.classList.remove("show"); return; } // 10 = Good Service

    b.classList.add("show");
    b.classList.remove("disruption","severe");
    b.classList.add(sev <= 5 ? "severe" : "disruption");
    const desc = worst.reason || worst.statusSeverityDescription || "Service disruption";
    b.innerHTML = `<strong>${statusCache.name || "Line"} — ${worst.statusSeverityDescription || "Disruption"}</strong>${desc}`;
  }

  function render(){
    renderStatus();
    const list = $("trainsList");
    const now = Date.now();

    const distM = userPos ? (walkRouteM ?? haversine(userPos, STATION)) : null;

    if (!arrivalsCache.length){
      list.innerHTML = `<div class="foot-status">No live inbound departures yet.</div>`;
      $("paceVal").textContent = "—";
      $("paceSub").textContent = userPos ? "Waiting for TfL data…" : "Waiting for location & data…";
      $("paceDesc").textContent = "";
      $("verdict").className = "verdict";
      $("distVal").textContent = distM != null ? fmtKm(distM) : "—";
      $("coolVal").textContent = `${Math.round(cooldownSeconds(tempC)/60)} min`;
      $("trainVal").textContent = "—";
      return;
    }

    if (!userPos){
      list.innerHTML = "";
      arrivalsCache.slice(0,6).forEach(a => {
        const mins = Math.max(0, Math.round((a.eta - now)/60000));
        const row = document.createElement("div");
        row.className = "train-row";
        row.innerHTML = `<div class="when">${mins===0?"due":mins+" min"}</div>
          <div class="meta">${a.line||""}<br>→ ${a.destination||""}${a.platform?" · "+a.platform:""}</div>`;
        list.appendChild(row);
      });
      $("paceVal").textContent = "—";
      $("paceSub").textContent = "Waiting for location…";
      $("paceDesc").textContent = "";
      return;
    }

    // Pick first train you can make at power-walk or below; else first jog-able; else soonest
    const coolSecPick = cooldownSeconds(tempC);
    let pickedIdx = 0;
    for (let i=0; i<arrivalsCache.length; i++){
      const secs = (arrivalsCache[i].eta - now)/1000 - coolSecPick;
      if (secs <= 0) continue;
      const req = distM / secs;
      pickedIdx = i;
      if (req <= FAST) break;
    }
    const picked = arrivalsCache[pickedIdx];
    const secsLeft = (picked.eta - now)/1000;
    const coolSec = cooldownSeconds(tempC);
    const effectiveSecs = secsLeft - coolSec;
    const v = paceVerdict(distM, effectiveSecs);

    $("verdict").className = `verdict ${v.tier}`;
    $("paceVal").textContent = v.speed ? `${v.speed.toFixed(1)} km/h` : "—";
    $("paceSub").textContent = v.label;
    $("paceDesc").textContent = v.desc || "";
    $("distVal").textContent = fmtKm(distM) + (walkRouteM ? "" : " *");
    const coolMin = Math.round(coolSec/60);
    $("coolVal").textContent = `${coolMin} min${tempC != null ? ` · ${Math.round(tempC)}°` : ""}`;
    const mins = Math.max(0, Math.round(secsLeft/60));
    $("trainVal").textContent = mins <= 0 ? "now" : `${mins} min`;

    list.innerHTML = "";
    arrivalsCache.slice(0, 6).forEach((a, i) => {
      const mins = Math.max(0, Math.round((a.eta - now)/60000));
      const row = document.createElement("div");
      row.className = "train-row" + (i === pickedIdx ? " picked" : "");
      row.innerHTML = `<div class="when">${mins===0?"due":mins+" min"}</div>
        <div class="meta">${a.line||""}<br>→ ${a.destination||""}${a.platform?" · "+a.platform:""}</div>`;
      list.appendChild(row);
    });
  }

  // ---------- Pollers ----------
  async function pollArrivals(){
    try {
      arrivalsCache = await getArrivals();
      render();
    } catch (e) {
      $("trainsList").innerHTML = `<div class="err">${e.message}</div>`;
    }
  }
  async function pollStatus(){
    statusCache = await getLineStatus();
    renderStatus();
  }
  async function pollWeather(){
    tempC = await getTemperature();
    render();
  }

  // ---------- Boot ----------
  (async () => {
    await getStationCoords();
    startWatch();
    pollArrivals();
    pollStatus();
    pollWeather();
    setInterval(pollArrivals, REFRESH_ARRIVALS_MS);
    setInterval(pollStatus, REFRESH_STATUS_MS);
    setInterval(pollWeather, REFRESH_WEATHER_MS);
    setInterval(render, 1000);
  })();
</script>

</body>
</html>
